[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mend"
version = "1.0.0"
description = "MEND: reinforcement learning for flow models via proximal velocity matching"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Shreshth Saini", email = "saini.2@utexas.edu"},
  {name = "Neil Birkbeck"},
  {name = "Yilin Wang"},
  {name = "Balu Adsumilli"},
  {name = "Alan C. Bovik"},
]
dependencies = [
  "absl-py",
  "accelerate>=1.4",
  "datasets>=3.3",
  "diffusers>=0.36.0",
  # Transformers 4.51 requires the pre-1.0 Hub API. Keep the upper bound
  # explicit so a later unrelated pip install cannot break model imports.
  "huggingface-hub>=0.30,<1.0",
  "ml-collections",
  "numpy>=1.26",
  "pandas>=2.2",
  "peft>=0.10",
  "pillow>=10.4",
  "scipy>=1.15",
  "torch>=2.6",
  "torchvision>=0.21",
  "tqdm>=4.67",
  # HPSv3 checkpoints use the pre-4.57 Qwen2-VL state-dict layout. 4.51.x is
  # also new enough for Z-Image and is the release's validated common stack.
  "transformers>=4.51,<4.52",
  "wandb>=0.18",
]

[project.optional-dependencies]
rewards = [
  "fairscale==0.4.13",
  "open-clip-torch>=2.31",
  # Transformers 4.51 imports its timm wrapper while resolving AutoModel.
  # ImageReward's old package metadata pins timm 0.6.13, so install
  # ImageReward itself with --no-deps as documented in guides/INSTALL.md.
  "timm>=1.0",
]
analysis = [
  # Figure builders in mend/analysis.
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://shreshthsaini.github.io/MEND-RL/"
Repository = "https://github.com/shreshthsaini/MEND-RL"
Paper = "https://arxiv.org/abs/2610.05954"

[tool.setuptools.packages.find]
include = ["mend", "mend.*", "baselines", "baselines.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
